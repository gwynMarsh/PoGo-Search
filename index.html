<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon GO Search Builder</title>

  <!-- Emoji Favicon-->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👀</text></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header-row">
    <h2>Search Builder</h2>
    <button id="theme-btn" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
  </div>

  <!-- Quantity (Count) Slider added as first block for quick cleanup -->
  <details open>
    <summary class="section-title">Quantity (Count)</summary>
    <div class="section-content">
      <div class="content-inner slider-container">
        <div class="slider-header">
          <span class="slider-value-display" id="count-display">Off</span>
          <label class="exact-toggle">
            <input type="checkbox" id="count-exact" onchange="updateSliderUI(); buildString();"> Exact Match Only
          </label>
        </div>
        <!-- Max set to 15, common for hoarding. Adjust max as needed -->
        <input type="range" id="count-slider" min="0" max="15" value="0" oninput="updateSliderUI(); buildString();">
      </div>
    </div>
  </details>

  <!-- Appraisal & Stars -->
  <details open>
    <summary class="section-title">Appraisal & Stars</summary>
    <div class="section-content">
      <div class="content-inner">
        <div class="chip-grid" data-group="stars">
          <button class="chip" data-filter="0*">0☆</button>
          <button class="chip" data-filter="1*">1★</button>
          <button class="chip" data-filter="2*">2★★</button>
          <button class="chip" data-filter="3*">3★★★</button>
          <button class="chip" data-filter="4*">4★★★★</button>
          <button class="chip" data-filter="0attack">0 Attack</button>
        </div>
      </div>
    </div>
  </details>

  <!-- CP Range -->
  <details open>
    <summary class="section-title">CP Range</summary>
    <div class="section-content">
      <div class="content-inner">
        <div class="chip-grid" data-group="cp">
          <button class="chip" data-filter="cp-1500">Great League (≤1500)</button>
          <button class="chip" data-filter="cp1501-2500">Ultra League (1501–2500)</button>
          <button class="chip" data-filter="cp2501-">Master League (2501+)</button>
        </div>
        <div class="cp-custom-row">
          <input type="number" id="cp-min" placeholder="Min CP" oninput="buildString()">
          <input type="number" id="cp-max" placeholder="Max CP" oninput="buildString()">
        </div>
      </div>
    </div>
  </details>

  <!-- Pokémon Types -->
  <details open>
    <summary class="section-title">Pokémon Types</summary>
    <div class="section-content">
      <div class="content-inner">
        <div class="chip-grid" data-group="types">
          <button class="chip" data-filter="bug">🪲 Bug</button>
          <button class="chip" data-filter="dark">🌒 Dark</button>
          <button class="chip" data-filter="dragon">🐲 Dragon</button>
          <button class="chip" data-filter="electric">⚡ Electric</button>
          <button class="chip" data-filter="fairy">🧚 Fairy</button>
          <button class="chip" data-filter="fighting">🥊 Fighting</button>
          <button class="chip" data-filter="fire">🔥 Fire</button>
          <button class="chip" data-filter="flying">🪽 Flying</button>
          <button class="chip" data-filter="ghost">👻 Ghost</button>
          <button class="chip" data-filter="grass">🌱 Grass</button>
          <button class="chip" data-filter="ground">⛰️ Ground</button>
          <button class="chip" data-filter="ice">❄️ Ice</button>
          <button class="chip" data-filter="normal">🐻 Normal</button>
          <button class="chip" data-filter="poison">🍄 Poison</button>
          <button class="chip" data-filter="psychic">🌀 Psychic</button>
          <button class="chip" data-filter="rock">🪨 Rock</button>
          <button class="chip" data-filter="steel">⚙️ Steel</button>
          <button class="chip" data-filter="water">💧 Water</button>
        </div>
      </div>
    </div>
  </details>

  <!-- Status & Rarity -->
  <details open>
    <summary class="section-title">Status & Rarity</summary>
    <div class="section-content">
      <div class="content-inner">
        <div class="chip-grid" data-group="status">
          <button class="chip" data-filter="shiny">✨ Shiny</button>
          <button class="chip" data-filter="shadow">🌑 Shadow</button>
          <button class="chip" data-filter="purified">🤍 Purified</button>
          <button class="chip" data-filter="lucky">🍀 Lucky</button>
          <button class="chip" data-filter="legendary">🐉 Legendary</button>
          <button class="chip" data-filter="mythical">🦄 Mythical</button>
          <button class="chip" data-filter="costume">🎩 Costume</button>
        </div>
      </div>
    </div>
  </details>

  <!-- Exclusions -->
  <details open>
    <summary class="section-title">Exclusions</summary>
    <div class="section-content">
      <div class="content-inner">
        <div class="chip-grid" data-group="exclusions">
          <button class="chip" data-filter="!favorite">❌ Favorite</button>
          <button class="chip" data-filter="!4*">❌ 4★★★★</button>
          <button class="chip" data-filter="!legendary">❌ Legendary</button>
          <button class="chip" data-filter="!mythical">❌ Mythical</button>
          <button class="chip" data-filter="!shadow">❌ Shadow</button>
          <button class="chip" data-filter="!shiny">❌ Shiny</button>
        </div>
      </div>
    </div>
  </details>

  <div class="output-container">
    <div class="output-label">Generated Search String</div>
    <div id="output-text" class="output-text">Select filters above...</div>
    <div class="button-row">
      <button class="btn btn-primary" onclick="copyString()">Copy</button>
      <button class="btn btn-secondary" onclick="resetAll()">Reset</button>
    </div>
  </div>

  <div class="app-footer">
    © 2026 • Pokémon GO Search Builder
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
      localStorage.setItem('app-theme', isDark ? 'dark' : 'light');
    }

    window.onload = function() {
      if (localStorage.getItem('app-theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('theme-btn').innerText = '☀️';
      }
      updateSliderUI();
      buildString();
    };

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        if (chip.parentElement.dataset.group === 'cp') {
          document.getElementById('cp-min').value = '';
          document.getElementById('cp-max').value = '';
        }
        chip.classList.toggle('active');
        buildString();
      });
    });

    function updateSliderUI() {
      const val = parseInt(document.getElementById('count-slider').value);
      const exact = document.getElementById('count-exact').checked;
      const display = document.getElementById('count-display');
      
      if (val === 0) {
        display.innerText = 'Off';
        display.style.color = 'inherit';
      } else {
        display.innerText = exact ? `Exactly ${val}` : `${val} or more`;
        display.style.color = 'var(--accent-color)';
      }
    }

    function buildString() {
      const groups = document.querySelectorAll('.chip-grid');
      let groupQueries = [];

      // 1. Process Count Slider
      const countVal = parseInt(document.getElementById('count-slider').value);
      const countExact = document.getElementById('count-exact').checked;
      if (countVal > 0) {
        groupQueries.push(countExact ? `count${countVal}` : `count${countVal}-`);
      }

      // 2. Process Chips
      groups.forEach(group => {
        const activeChips = group.querySelectorAll('.chip.active');
        if (activeChips.length > 0) {
          const groupName = group.dataset.group;
          const filters = Array.from(activeChips).map(c => c.dataset.filter);

          if (groupName === 'exclusions') {
            groupQueries.push(filters.join(' & '));
          } else {
            groupQueries.push(filters.join(','));
          }
        }
      });

      // 3. Process Custom CP
      const minCp = document.getElementById('cp-min').value;
      const maxCp = document.getElementById('cp-max').value;
      if (minCp || maxCp) {
        document.querySelectorAll('[data-group="cp"] .chip').forEach(c => c.classList.remove('active'));
        
        if (minCp && maxCp) {
          groupQueries.push(`cp${minCp}-${maxCp}`);
        } else if (minCp) {
          groupQueries.push(`cp${minCp}-`);
        } else if (maxCp) {
          groupQueries.push(`cp-${maxCp}`);
        }
      }

      const finalString = groupQueries.length > 0 ? groupQueries.join(' & ') : '';
      document.getElementById('output-text').innerText = finalString || 'Select filters above...';
    }

    function copyString() {
      const str = document.getElementById('output-text').innerText;
      if (!str || str === 'Select filters above...') return;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(str).then(showCopiedFeedback);
      } else {
        const textArea = document.createElement("textarea");
        textArea.value = str;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          showCopiedFeedback();
        } catch (err) {
          console.error('Copy failed', err);
        }
        document.body.removeChild(textArea);
      }
    }

    function showCopiedFeedback() {
      const btn = document.querySelector('.btn-primary');
      const oldText = btn.innerText;
      btn.innerText = 'Copied!';
      setTimeout(() => btn.innerText = oldText, 1500);
    }

    function resetAll() {
      document.querySelectorAll('.chip.active').forEach(chip => chip.classList.remove('active'));
      document.getElementById('cp-min').value = '';
      document.getElementById('cp-max').value = '';
      
      // Reset Slider
      document.getElementById('count-slider').value = 0;
      document.getElementById('count-exact').checked = false;
      updateSliderUI();
      
      buildString();
    }
  </script>
</body>
</html>
